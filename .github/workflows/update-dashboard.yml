name: Refresh dashboard

# 10:00 UTC = 13:00 Minsk (UTC+3, no DST). GitHub's scheduler can be a few
# minutes late and occasionally skips a run under load; workflow_dispatch is
# there for manual refreshes.
#
# The push trigger is a convenience: it starts a run from any commit to main
# (so the first run needs no "Run workflow" click), and keeps the published
# site in sync after a code change. It cannot loop - commits pushed with the
# built-in GITHUB_TOKEN never trigger workflows - and paths-ignore keeps the
# bot's own data/docs commits from queueing extra runs.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "data/**"

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Scrape cars.av.by
        id: scrape
        # A blocked or throttled scrape must not take the site down: the
        # previous snapshot is still committed, so we rebuild from it.
        # cars.av.by answers datacenter IPs with a non-standard 468, so the
        # scrape is retried with a growing pause before we give up.
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            echo "::group::scrape attempt $attempt"
            if python -m scraper.cli --pages 50; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::attempt $attempt failed, retrying in $((attempt * 45))s"
            sleep $((attempt * 45))
          done
          echo "::error::scrape failed after 3 attempts - publishing the previous snapshot"
          exit 1

      - name: Build static site
        run: python scripts/build-static.py

      - name: Commit refreshed data
        run: |
          if [ "${{ steps.scrape.outcome }}" != "success" ]; then
            echo "::warning::Scrape failed - publishing the previous snapshot"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cars.json docs
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "chore: refresh dashboard data ($(date -u +%Y-%m-%d))"
          git push

      - name: Summarize
        if: always()
        run: |
          python -c "import json,pathlib; m=json.loads(pathlib.Path('data/cars.json').read_text(encoding='utf-8')); print('cars:', m.get('count')); print('scraped_at:', m.get('scraped_at'))"
          echo "scrape step: ${{ steps.scrape.outcome }}"
