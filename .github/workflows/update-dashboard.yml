name: Rebuild dashboard

# Manual rebuild of the published site.
#
# There is no cron on purpose: cars.av.by answers requests from GitHub's
# datacenter IPs with a non-standard HTTP 468 (bot filter), so the cloud runner
# cannot take a fresh snapshot. The data is scraped locally instead and
# committed by hand; this workflow rebuilds docs/ from whatever data/cars.json
# is in the repository and publishes it to GitHub Pages.
#
# The scrape step is still here behind a manual toggle: if the block ever
# disappears, tick "scrape" when dispatching and the cloud takes over.
on:
  workflow_dispatch:
    inputs:
      scrape:
        description: "Try scraping cars.av.by from the runner (usually blocked with HTTP 468)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"

permissions:
  contents: write

concurrency:
  group: rebuild-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Probe cars.av.by
        if: github.event_name == 'workflow_dispatch' && inputs.scrape
        continue-on-error: true
        run: python scripts/probe-avby.py

      - name: Scrape cars.av.by
        id: scrape
        # Opt-in only, and never fatal: a blocked scrape keeps the committed
        # snapshot, so the site still rebuilds and publishes.
        if: github.event_name == 'workflow_dispatch' && inputs.scrape
        continue-on-error: true
        run: |
          for attempt in 1 2 3; do
            echo "::group::scrape attempt $attempt"
            if python -m scraper.cli --pages 50; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::attempt $attempt failed, retrying in $((attempt * 45))s"
            sleep $((attempt * 45))
          done
          echo "::error::scrape failed after 3 attempts - publishing the previous snapshot"
          exit 1

      - name: Build static site
        run: python scripts/build-static.py

      - name: Commit refreshed data
        run: |
          if [ "${{ steps.scrape.outcome }}" = "failure" ]; then
            echo "::warning::Scrape failed - publishing the previous snapshot"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cars.json docs
          if git diff --cached --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "chore: rebuild dashboard ($(date -u +%Y-%m-%d))"
          # A manual upload can land while this job runs; rebase instead of
          # failing with a non-fast-forward rejection.
          git pull --rebase --autostash origin main
          git push

      - name: Summarize
        if: always()
        run: |
          python -c "import json,pathlib; m=json.loads(pathlib.Path('data/cars.json').read_text(encoding='utf-8')); print('cars:', m.get('count')); print('scraped_at:', m.get('scraped_at'))"
          echo "scrape step: ${{ steps.scrape.outcome }}"
